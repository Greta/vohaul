<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vohaul.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080d" />
    <meta
      name="description"
      content="Vohaul by Greta Prisby. A hard-edged sci-fi React UI kit with an oversized ego, electric neon, and a deceptively pleasant pastel disguise."
    />
    <title>Vohaul — Total control. Obviously.</title>
    <script>
      try {
        const theme = localStorage.getItem('vohaul-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
